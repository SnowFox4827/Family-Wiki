<header class="topbar">
  <div class="brand">
    <button id="sidebar-toggle-btn" class="btn btn-ghost sidebar-toggle" title="Toggle Navigation Sidebar" aria-label="Toggle Navigation Sidebar">
      <span id="sidebar-toggle-icon">☰</span>
    </button>
    <span class="brand-mark">&#10038;</span>
    <span class="brand-text">The Family Wiki</span>
  </div>
  <div class="search-wrap">
    <input id="search-input" type="text" placeholder="Search the ledger&hellip;" autocomplete="off">
    <div id="search-results" class="search-results hidden"></div>
  </div>
  <div class="header-actions">
    <button id="theme-toggle-btn" class="theme-switch" role="switch" title="Toggle Light/Dark Mode" aria-label="Toggle Light/Dark Mode">
      <span class="theme-switch-icon theme-switch-icon-sun">☀️</span>
      <span class="theme-switch-icon theme-switch-icon-moon">🌙</span>
      <span class="theme-switch-thumb"></span>
    </button>
    <button id="backup-btn" class="btn btn-ghost" title="Download a full backup (database + images) as a zip file">⇩ Backup</button>
    <button id="new-page-btn" class="btn btn-accent">+ New Page</button>
  </div>
</header>
