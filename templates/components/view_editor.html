<section id="view-editor" class="view hidden">
  <form id="editor-form" class="editor">
    <div class="editor-row">
      <label for="field-title">Title</label>
      <input id="field-title" type="text" placeholder="e.g. Grandma's Kitchen" required>
    </div>
    <div class="editor-row editor-row-split">
      <div>
        <label for="field-category">Category</label>
        <input id="field-category" list="category-options" type="text" placeholder="e.g. Recipes">
        <datalist id="category-options"></datalist>
      </div>
      <div>
        <label for="field-tags">Tags <span class="hint">(comma separated)</span></label>
        <input id="field-tags" type="text" placeholder="e.g. holidays, dessert">
      </div>
      <div>
        <label for="field-author">Written by</label>
        <input id="field-author" type="text" placeholder="Your name">
      </div>
    </div>
    <div class="editor-row">
      <div class="editor-label-row">
        <label for="field-content">
          Content
          <span class="hint">Markdown: # heading, **bold**, *italic*, - list, [[Link]], ![alt](image)</span>
        </label>
        <div class="upload-tools">
          <input type="file" id="image-upload-input" accept="image/*" class="hidden">
          <button type="button" id="upload-image-btn" class="btn btn-ghost btn-sm">
            📷 Upload Image
          </button>
        </div>
      </div>
      <textarea id="field-content" rows="16" placeholder="Once upon a time..."></textarea>
      <div id="upload-status" class="upload-status hidden"></div>
    </div>
    <div class="editor-actions">
      <button type="submit" class="btn btn-accent">Save Page</button>
      <button type="button" id="cancel-edit-btn" class="btn btn-ghost">Cancel</button>
    </div>
  </form>
</section>
