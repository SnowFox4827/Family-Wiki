<section id="view-page" class="view hidden">
  <article class="ledger-page">
    <div id="page-tab" class="ledger-tab"></div>
    <div class="ledger-body">
      <div class="page-meta-row">
        <span id="page-category" class="chip chip-category"></span>
        <span id="page-tags"></span>
      </div>
      <h1 id="page-title" class="ledger-title"></h1>
      <div class="page-meta-line">
        <span id="page-author"></span>
        <span id="page-updated"></span>
      </div>
      <div id="page-content" class="ledger-content"></div>
    </div>
    <div class="ledger-actions">
      <button id="download-page-btn" class="btn btn-ghost" title="Download article as Markdown">Download</button>
      <button id="edit-page-btn" class="btn btn-ghost">Edit Page</button>
      <button id="delete-page-btn" class="btn btn-ghost btn-danger">Delete</button>
    </div>
  </article>
</section>
