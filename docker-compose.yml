services:
  wiki:
    build: .
    ports:
      - "5005:5000"
    environment:
      - WIKI_DB_PATH=/app/data/wiki.db
    volumes:
      - wiki-data:/app/data
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    environment:
      - WIKI_DB_PATH=/app/data/wiki.db
      - BACKUP_INTERVAL=${BACKUP_INTERVAL:-86400}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
      - BACKUP_DIR=/backups
    volumes:
      - wiki-data:/app/data:ro
      # Backup destination, from .env (default: ./backups next to the project).
      # Point it at your NAS mount to write backups straight to the NAS.
      - ${BACKUP_DIR:-./backups}:/backups
    restart: unless-stopped
