services:
  wiki:
    build: .
    ports:
      - "5005:5000"
    environment:
      - WIKI_DB_PATH=/app/data/wiki.db
    volumes:
      - wiki-data:/app/data
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    environment:
      - WIKI_DB_PATH=/app/data/wiki.db
      - BACKUP_INTERVAL=86400   # every 24h
      - BACKUP_KEEP=14          # keep the 14 most recent zips
    volumes:
      - wiki-data:/app/data:ro
      - wiki-backups:/backups
    restart: unless-stopped

volumes:
  wiki-data:
  wiki-backups:
